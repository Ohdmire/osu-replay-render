[package]
name = "osu_replay_render"
version = "0.13.1"
edition = "2024"
license = "MIT"

[dependencies]
osu_replay_judge = { git = "https://github.com/Ohdmire/osu-replay-judge.git", branch = "master" }
# Shared .osu/.osb/.osr parsing (same checkout the patched judge re-exports).
osu-parse = { git = "https://github.com/Ohdmire/osu-parse.git" }
rosu-pp = { git = "https://github.com/Apeuriox/rosu-pp.git", branch = "pp-rework-202607" }
# Beatmap storyboard layer (.osu Events + shared .osb) — same checkout as
# the standalone renderer, library target only (no winit/zip on Android).
osu-storyboard-render = { git = "https://github.com/Ohdmire/osu-storyboard-render.git", branch = "main", default-features = false }
wgpu = "24"
raw-window-handle = "0.6"
pollster = "0.4"
png = "0.17"
jpeg-decoder = "0.3"
ab_glyph = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 进程内音频解码(皮肤采样 mp3/ogg/flac → PCM,替代外部 ffmpeg;宿主
# Aria 经 resolve_sample_wav 复用,与其 kira 侧 symphonia 同版本统一)
symphonia = { version = "0.5", features = ["mp3", "ogg", "vorbis", "flac", "wav", "pcm"] }

# 本地 sibling checkout 接管同 URL git 依赖(osu-parse / osu-replay-judge
# 内部引用统一到同一份,类型不分裂;与 Aria 的 patch 同款)。
[patch."https://github.com/Ohdmire/osu-parse.git"]
osu-parse = { path = "../osu-parse" }

[profile.release]
lto = "thin"

[lib]
name = "osu_replay_render"
path = "src/lib.rs"

[[bin]]
name = "osu_replay_render"
path = "src/main.rs"
